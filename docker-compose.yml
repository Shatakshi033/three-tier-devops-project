
services:
  mongodb:
    image: mongo:7
    container_name: three-tier-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: three-tier-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/employeeDB
      PORT: 5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: three-tier-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
